server.port=${PORT:8080}
spring.application.name=protecphone-${SERVICE_ROLE:product}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=3s
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
protecphone.role=${SERVICE_ROLE:product}
protecphone.prefix=${REDIS_PREFIX:protecphone}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/protecphone?retryWrites=false&w=majority&journal=true&serverSelectionTimeoutMS=3000}
